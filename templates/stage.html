{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Stage Classification</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <form id="stage-form" class="bg-white p-4 rounded shadow space-y-3">
    <div class="grid grid-cols-2 gap-2">
      <label class="text-sm">Age</label>
      <input type="number" id="age" class="border p-1 rounded" min="0" max="120" value="60" />
      <label class="text-sm">BMI</label>
      <input type="number" id="bmi" class="border p-1 rounded" step="0.1" value="26" />
      <label class="text-sm">Smoking</label>
      <select id="smoke" class="border p-1 rounded">
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>
      <label class="text-sm">Diet quality (0-10)</label>
      <input type="number" id="diet" class="border p-1 rounded w-full" min="0" max="10" value="6" />
      <label class="text-sm">Physical activity (0-10)</label>
      <input type="number" id="activity" class="border p-1 rounded w-full" min="0" max="10" value="5" />
      <label class="text-sm">Socioeconomic status</label>
      <select id="ses" class="border p-1 rounded">
        <option value="1">Low</option>
        <option value="2">Medium</option>
        <option value="3" selected>High</option>
      </select>
    </div>
    <div class="flex space-x-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Predict Stage</button>
      <a href="/survival" class="bg-gray-200 px-4 py-2 rounded">Go to Survival Analysis</a>
    </div>
  </form>

  <div>
    <div id="stage-result" class="bg-white p-4 rounded shadow hidden">
      <div class="flex items-center justify-between">
        <div>
          <div id="stage-badge" class="inline-block px-3 py-1 rounded text-white font-semibold"></div>
          <div id="urgency" class="mt-2 text-sm font-semibold text-red-600"></div>
        </div>
        <div class="w-1/2">
          <canvas id="prob-bar" height="120"></canvas>
        </div>
      </div>
    </div>
    
    <div id="error-card" class="bg-red-100 border border-red-400 text-red-700 p-3 rounded hidden"></div>

    <div class="bg-white p-4 rounded shadow mt-4">
      <h3 class="font-semibold">Notes</h3>
      <p class="text-sm text-gray-600">Uses LightGBM stage classification model. Features: age, BMI, smoking, diet, activity, socioeconomic status.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.getElementById('stage-form').addEventListener('submit', function(e){
  e.preventDefault();
  const payload = {
    age: Number(document.getElementById('age').value),
    bmi: Number(document.getElementById('bmi').value),
    smoke: Number(document.getElementById('smoke').value),
    diet: Number(document.getElementById('diet').value),
    activity: Number(document.getElementById('activity').value),
    ses: Number(document.getElementById('ses').value),
  };
  
  fetch('/api/predict-stage', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(data => {
    if(data.error){
      document.getElementById('error-card').textContent = data.error;
      document.getElementById('error-card').classList.remove('hidden');
    } else {
      showStage(data.stage, data.probabilities, data.urgency);
    }
  })
  .catch(e => {
    document.getElementById('error-card').textContent = 'Prediction failed: ' + e;
    document.getElementById('error-card').classList.remove('hidden');
  });
});

let probChart=null;
function showStage(stage, probs, urgency){
  document.getElementById('stage-result').classList.remove('hidden');
  document.getElementById('error-card').classList.add('hidden');
  
  const badge = document.getElementById('stage-badge');
  const colors = {I:'#10b981', II:'#f59e0b', III:'#f97316', IV:'#ef4444'};
  badge.textContent = 'Stage ' + stage;
  badge.style.backgroundColor = colors[stage] || '#6b7280';
  
  // urgency
  const urgencyEl = document.getElementById('urgency');
  if(urgency) urgencyEl.textContent = urgency;
  else urgencyEl.textContent = '';
  
  // probability bar
  const stages = ['I', 'II', 'III', 'IV'];
  const values = stages.map(s => Math.round((probs[s] || 0) * 100));
  const ctx = document.getElementById('prob-bar').getContext('2d');
  if(probChart) probChart.destroy();
  probChart = new Chart(ctx, { 
    type:'bar', 
    data:{ 
      labels: stages.map(s=>'Stage '+s), 
      datasets:[{ 
        label: 'Probability (%)',
        data: values, 
        backgroundColor: stages.map(s=>colors[s]) 
      }] 
    }, 
    options:{ 
      indexAxis:'y', 
      plugins:{legend:{display:false}}, 
      scales:{x:{beginAtZero:true, max:100}} 
    } 
  });
}
</script>

{% endblock %}
